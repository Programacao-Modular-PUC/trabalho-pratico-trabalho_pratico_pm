<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamentos — Hospedagem Maraú</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
<div class="page-wrapper">

  <div id="sidebar-container"></div>

  <div class="main-content">
    <div id="topbar-container"></div>

    <div class="page-body">

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Processar Pagamento</h2>
        </div>

        <form id="formPagamento" class="form-grid">
          <div class="form-group">
            <label for="aluguelId">ID do Aluguel</label>
            <input type="number" id="aluguelId" placeholder="Ex: 42" required />
          </div>

          <div class="form-group">
            <label for="meioPagamento">Meio de Pagamento</label>
            <select id="meioPagamento" required>
              <option value="">Selecione...</option>
              <option value="PIX">PIX</option>
              <option value="CARTAO_CREDITO">Cartão de Crédito</option>
              <option value="CARTAO_DEBITO">Cartão de Débito</option>
              <option value="DINHEIRO">Dinheiro</option>
              <option value="CARTEIRA_DIGITAL">Carteira Digital</option>
            </select>
          </div>

          <!-- PIX -->
          <div id="camposPix" class="campos-pagamento hidden form-group full-width">
            <label for="chavePix">Chave PIX</label>
            <input type="text" id="chavePix" placeholder="CPF, e-mail, telefone ou chave aleatória" />
          </div>

          <!-- Cartão -->
          <div id="camposCartao" class="campos-pagamento hidden">
            <div class="form-group">
              <label for="numeroCartao">Número do Cartão</label>
              <input type="text" id="numeroCartao" placeholder="0000 0000 0000 0000" maxlength="19" />
            </div>
            <div class="form-group">
              <label for="nomeTitular">Nome do Titular</label>
              <input type="text" id="nomeTitular" placeholder="Como no cartão" />
            </div>
            <div id="campoParcelas" class="form-group hidden">
              <label for="parcelas">Parcelas</label>
              <select id="parcelas">
                <option value="1">1x sem juros</option>
                <option value="2">2x</option>
                <option value="3">3x</option>
                <option value="6">6x</option>
                <option value="12">12x</option>
              </select>
            </div>
          </div>

          <!-- Carteira Digital -->
          <div id="camposCarteira" class="campos-pagamento hidden form-group full-width">
            <label for="carteiraNome">Carteira Digital</label>
            <select id="carteiraNome">
              <option value="PICPAY">PicPay</option>
              <option value="MERCADOPAGO">Mercado Pago</option>
              <option value="PAGBANK">PagBank</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Processar Pagamento</button>
          </div>
        </form>
      </div>

      <!-- Resultado -->
      <div id="resultadoPagamento" class="card hidden">
        <div class="card-header">
          <h2 class="card-title">Resultado</h2>
        </div>
        <div id="conteudoResultado"></div>
      </div>

    </div>
  </div>
</div>

<script type="module">
  import { initSidebar } from '../components/sidebar.js';
  import { initTopbar }  from '../components/topbar.js';
  import { showToast }   from '../components/toast.js';
  import { api }         from '../components/api.js';

  initSidebar('pagamentos.html');
  initTopbar('Pagamentos');

  const meio       = document.getElementById('meioPagamento');
  const form       = document.getElementById('formPagamento');
  const resultado  = document.getElementById('resultadoPagamento');
  const conteudo   = document.getElementById('conteudoResultado');

  const campoMap = {
    PIX:             ['camposPix'],
    CARTAO_CREDITO:  ['camposCartao', 'campoParcelas'],
    CARTAO_DEBITO:   ['camposCartao'],
    DINHEIRO:        [],
    CARTEIRA_DIGITAL:['camposCarteira'],
  };

  meio.addEventListener('change', () => {
    document.querySelectorAll('.campos-pagamento').forEach(el => el.classList.add('hidden'));
    (campoMap[meio.value] || []).forEach(id => {
      document.getElementById(id)?.classList.remove('hidden');
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    resultado.classList.add('hidden');

    const aluguelId = document.getElementById('aluguelId').value;
    const dados = {
      chavePix:      document.getElementById('chavePix').value   || null,
      numeroCartao:  document.getElementById('numeroCartao').value.replace(/\s/g, '') || null,
      nomeTitular:   document.getElementById('nomeTitular').value || null,
      parcelas:      parseInt(document.getElementById('parcelas').value) || 1,
      carteiraNome:  document.getElementById('carteiraNome').value || null,
    };

    try {
      const resp = await api.alugueis.processarPagamento(aluguelId, meio.value, dados);
      conteudo.innerHTML = `
        <p><strong>Status:</strong> <span class="badge badge-green">Aprovado</span></p>
        <p><strong>Código:</strong> ${resp.codigoTransacao}</p>
        <p><strong>Valor processado:</strong> R$ ${resp.valorProcessado.toFixed(2).replace('.', ',')}</p>
        <p><strong>Mensagem:</strong> ${resp.mensagem}</p>`;
      resultado.classList.remove('hidden');
      showToast('Pagamento processado com sucesso!', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    }
  });
</script>
</body>
</html>
