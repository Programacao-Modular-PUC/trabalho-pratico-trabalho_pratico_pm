<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Hospedagem Maraú</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-page">

    <div class="login-visual">
      <span class="login-visual-badge">Maraú · Bahia · Brasil</span>
      <h1 class="login-visual-title">Hospedagem<br/>Maraú</h1>
      <p class="login-visual-sub">
        Sistema de gerenciamento de residências e quartos para
        anfitriões da Península de Maraú.
      </p>
    </div>

    <div class="login-form-side">
      <div class="login-form-inner">
        <h2>Entrar</h2>
        <p>Acesse sua conta para gerenciar as hospedagens</p>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" />
        </div>

        <div style="margin-bottom: 24px; text-align: right;">
          <a href="#" style="font-size: 13px; color: var(--mar); text-decoration: none;">
            Esqueci minha senha
          </a>
        </div>

        <button class="btn btn-primary btn-lg" style="width: 100%; justify-content: center;" onclick="window.location='index.html'">
          Entrar no sistema
        </button>

        <p style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--texto-leve);">
          Não tem uma conta? 
          <a href="cadastro.html" style="color: var(--mar); text-decoration: none; font-weight: 500;">Cadastre-se</a>
        </p>
      </div>
    </div>

  </div>
</body>
</html>
